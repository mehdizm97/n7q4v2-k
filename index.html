<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>تست تلگرام</title>
<style>
body{font-family:Tahoma,sans-serif;padding:20px;max-width:480px;margin:auto;background:#fdf6f0;color:#4a3c35}
button{width:100%;padding:14px;margin:8px 0;border:0;border-radius:12px;background:#c47a8a;color:#fff;font-size:16px;font-family:inherit}
pre{background:#fff;padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-all;direction:ltr;text-align:left;font-size:13px;min-height:80px}
</style>
</head>
<body>
<h3>تست ارسال به تلگرام</h3>
<button onclick="t1()">۱) بررسی توکن (getMe)</button>
<button onclick="t2()">۲) ارسال پیام تست</button>
<button onclick="t3()">۳) دیدن آخرین پیام‌های رسیده به ربات (getUpdates)</button>
<pre id="o">نتیجه اینجا نمایش داده می‌شود...</pre>
<script>
var TOK = "8600277006:AAE9aIEXRj7vNGNiiehXR5IObHjyhLoQ1CU";
var CH = "225010071";
var o = document.getElementById("o");
function show(x){ o.textContent = typeof x === "string" ? x : JSON.stringify(x, null, 2); }
function call(method, params){
  var body = new URLSearchParams();
  for(var k in params) body.append(k, params[k]);
  return fetch("https://api.telegram.org/bot" + TOK + "/" + method, {method:"POST", body:body}).then(function(r){ return r.json(); });
}
function t1(){ show("در حال بررسی..."); call("getMe", {}).then(show).catch(function(e){ show("خطای شبکه: " + e); }); }
function t2(){
  show("در حال ارسال...");
  call("sendMessage", {chat_id: CH, text: "✅ پیام تست - " + new Date().toLocaleString("fa-IR")})
    .then(function(j){
      if(j.ok) show("✅ ارسال شد. تلگرامت رو چک کن.\n\n" + JSON.stringify(j, null, 2));
      else show("❌ تلگرام رد کرد:\n" + j.description + "\n\n(اگه 'chat not found' یا 'bot can't initiate' بود، یعنی باید یک بار تو تلگرام به ربات /start بزنی)");
    })
    .catch(function(e){ show("❌ خطای شبکه/مرورگر: " + e); });
}
function t3(){
  show("در حال دریافت...");
  call("getUpdates", {}).then(function(j){
    if(!j.ok){ show(j); return; }
    var ids = {};
    j.result.forEach(function(u){ var m = u.message; if(m && m.chat) ids[m.chat.id] = (m.chat.username || m.chat.first_name || ""); });
    show("چت‌هایی که به ربات پیام داده‌اند (id : نام):\n" + JSON.stringify(ids, null, 2) + "\n\nchat_id فعلی تو فایل: " + CH);
  }).catch(function(e){ show("❌ " + e); });
}
</script>
</body>
</html>
